<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Главная</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            margin: 0;
            font-size: 14px;
        }

        .sidebar {
            background-color: #212529;
            color: white;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .sidebar a {
            color: #ddd;
            text-decoration: none;
            display: block;
            padding: 8px;
            border-radius: 4px;
        }

        .sidebar a:hover,
        .sidebar a.active {
            background-color: #0d6efd;
            color: white;
        }

        .user-menu {
            margin-top: auto;
            padding-top: 20px;
        }

        .product {
            max-width: 250px;
            margin: auto;
        }
    </style>
</head>
<body>

<div class="container-fluid">
    <div class="row">

        <!-- Боковое меню -->
        <aside class="col-3 col-md-2 sidebar p-3">
            <h5>▣ Меню</h5>

            <nav>
                <a class="active" href="home.html">⌂ Главная</a>
                <a href="catalog.html">▤ Каталог</a>
                <a href="category.html">▦ Категория</a>
                <a href="contacts.html">✉ Контакты</a>
            </nav>

            <!-- Пользователь внизу меню -->
            <div class="dropdown dropup user-menu">
                <button class="btn btn-secondary dropdown-toggle w-100"
                        type="button"
                        data-bs-toggle="dropdown"
                        aria-expanded="false">
                    👤 Пользователь
                </button>

                <ul class="dropdown-menu dropdown-menu-dark">
                    <li>
                        <a class="dropdown-item" href="#">Профиль</a>
                    </li>
                    <li>
                        <a class="dropdown-item" href="home.html">Выход</a>
                    </li>
                </ul>
            </div>
        </aside>

        <!-- Основная часть -->
        <main class="col-9 col-md-10 p-4">

            <header class="text-center mb-4">
                <h1>Главная</h1>
                <p class="text-secondary">
                    Добро пожаловать в наш магазин!
                </p>
            </header>

            <section class="row g-3 justify-content-center">

                <div class="col-12 col-md-6 col-lg-4">
                    <div class="card product">
                        <div class="card-header text-center">Товар 1</div>
                        <div class="card-body text-center">
                            <h4>$ 100</h4>
                            <p>Описание товара</p>
                            <button class="btn btn-outline-primary w-100">
                                Купить
                            </button>
                        </div>
                    </div>
                </div>

                <div class="col-12 col-md-6 col-lg-4">
                    <div class="card product">
                        <div class="card-header text-center">Товар 2</div>
                        <div class="card-body text-center">
                            <h4>$ 100</h4>
                            <p>Описание товара</p>
                            <button class="btn btn-outline-primary w-100">
                                Купить
                            </button>
                        </div>
                    </div>
                </div>

                <div class="col-12 col-md-6 col-lg-4">
                    <div class="card product">
                        <div class="card-header text-center">Товар 3</div>
                        <div class="card-body text-center">
                            <h4>$ 100</h4>
                            <p>Описание товара</p>
                            <button class="btn btn-outline-primary w-100">
                                Купить
                            </button>
                        </div>
                    </div>
                </div>

            </section>

            <footer class="text-center text-secondary mt-5">
                © 2026 Магазин
            </footer>
        </main>

    </div>
</div>

<!-- Скрипт для выпадающего меню -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
