<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Контакты</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            margin: 0;
            font-size: 14px;
        }

        .sidebar {
            background-color: #212529;
            color: white;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .sidebar a {
            color: #ddd;
            text-decoration: none;
            display: block;
            padding: 8px;
            border-radius: 4px;
        }

        .sidebar a:hover,
        .sidebar a.active {
            background-color: #0d6efd;
            color: white;
        }

        .user-menu {
            margin-top: auto;
            padding-top: 20px;
        }
    </style>
</head>
<body>

<div class="container-fluid">
    <div class="row">

        <aside class="col-3 col-md-2 sidebar p-3">
            <h5>▣ Меню</h5>

            <nav>
                <a href="home.html">⌂ Главная</a>
                <a href="catalog.html">▤ Каталог</a>
                <a href="category.html">▦ Категория</a>
                <a class="active" href="contacts.html">✉ Контакты</a>
            </nav>

            <div class="dropdown dropup user-menu">
                <button class="btn btn-secondary dropdown-toggle w-100"
                        type="button"
                        data-bs-toggle="dropdown"
                        aria-expanded="false">
                    👤 Пользователь
                </button>

                <ul class="dropdown-menu dropdown-menu-dark">
                    <li><a class="dropdown-item" href="#">Профиль</a></li>
                    <li><a class="dropdown-item" href="home.html">Выход</a></li>
                </ul>
            </div>
        </aside>

        <main class="col-9 col-md-10 p-4">

            <header class="text-center mb-5">
                <h1>Контакты</h1>
            </header>

            <section class="row justify-content-center g-4">

                <div class="col-12 col-lg-5">
                    <form action="/contacts/" method="post"
                          class="border rounded p-3">

                        <div class="mb-3">
                            <label for="name" class="form-label">Имя</label>
                            <input type="text" class="form-control"
                                   id="name" name="name" required>
                        </div>

                        <div class="mb-3">
                            <label for="email" class="form-label">Почта</label>
                            <input type="email" class="form-control"
                                   id="email" name="email" required>
                        </div>

                        <div class="mb-3">
                            <label for="message" class="form-label">
                                Сообщение
                            </label>
                            <textarea class="form-control"
                                      id="message" name="message"
                                      rows="3" required></textarea>
                        </div>

                        <button type="submit" class="btn btn-primary">
                            Отправить
                        </button>
                    </form>
                </div>

                <div class="col-12 col-lg-5">
                    <h5>Наши контакты</h5>
                    <p>
                        Если у вас возникли вопросы, напишите нам
                        через форму обратной связи.
                    </p>
                    <p>Почта: example@example.com</p>
                </div>

            </section>

            <footer class="text-center text-secondary mt-5 pt-3 border-top">
                © 2026 Магазин. Все права защищены.
            </footer>
        </main>

    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
